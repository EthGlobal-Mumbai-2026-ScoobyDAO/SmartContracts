optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts@5.3.0/=lib/v4-core/lib/openzeppelin-contracts/contracts/", "@openzeppelin/contracts@4.9.6/=lib/openzeppelin-contracts/contracts/", "@chainlink/contracts/=lib/chainlink-evm/contracts/", "v4-core/=lib/v4-core/src/", "chainlink-ccip/=lib/chainlink-ccip/chains/evm/contracts/"]
